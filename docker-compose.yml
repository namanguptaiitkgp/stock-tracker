services:
  timescaledb:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: algotrader
      POSTGRES_PASSWORD: ${DB_PASSWORD:-password}
      POSTGRES_DB: algotrader
    ports:
      - "5432:5432"
    volumes:
      - timescale_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U algotrader -d algotrader"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: .env
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  celery-worker:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: .env
    environment:
      # Force NullPool — celery prefork runs each task on a fresh loop,
      # so persistent asyncpg connections in the engine pool can't be
      # reused safely. See app/db/session.py for the full explanation.
      CELERY_NULL_POOL: "1"
    volumes:
      # Mirror the backend mount so task code edits land in the worker
      # without an image rebuild (matches the dev-mode `--reload` on
      # backend). Without this, new task modules go missing from the
      # worker's Celery registry.
      - ./backend:/app
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app worker --loglevel=info --queues=default,analysis,data

  celery-beat:
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: .env
    environment:
      CELERY_NULL_POOL: "1"
    volumes:
      - ./backend:/app
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app beat --loglevel=info

  frontend:
    build:
      context: ./frontend
      dockerfile: ../docker/frontend.Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      NEXT_PUBLIC_WS_URL: ws://localhost:8000
    volumes:
      - ./frontend/src:/app/src
      # Mount config files individually so edits to next.config.ts /
      # tsconfig.json / postcss / tailwind / eslint pick up without an
      # image rebuild. (node_modules and .next stay container-local.)
      - ./frontend/next.config.ts:/app/next.config.ts
      - ./frontend/tsconfig.json:/app/tsconfig.json
      - ./frontend/postcss.config.mjs:/app/postcss.config.mjs
    depends_on:
      - backend

  flower:
    profiles: ["monitoring"]
    build:
      context: ./backend
      dockerfile: ../docker/backend.Dockerfile
    env_file: .env
    ports:
      - "5555:5555"
    depends_on:
      redis:
        condition: service_healthy
    command: celery -A app.tasks.celery_app flower --port=5555

volumes:
  timescale_data:
  redis_data:
